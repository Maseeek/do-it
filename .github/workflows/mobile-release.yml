name: Mobile Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to distribute'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ios
          - android
      skip_tests:
        description: 'Skip running unit tests before release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-ios:
    name: Release iOS to TestFlight
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'ios'
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Run Build Verification
        run: |
          chmod +x scripts/build-ios.sh scripts/verify-mobile.sh
          ./scripts/verify-mobile.sh --ios

      - name: Deploy to TestFlight via Fastlane
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_IS_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_IS_BASE64 || 'true' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'DOIT123456' }}
          APPLE_ID: ${{ secrets.APPLE_ID || 'dev@doit.app' }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          SKIP_GIT_CHECK: 'true'
          RELEASE_NOTES: "Automated Release from tag ${{ github.ref_name }}"
        run: |
          cd ios
          bundle exec fastlane ios beta skip_tests:${{ inputs.skip_tests || false }}

      - name: Upload iOS Release IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doit-ios-release-ipa
          path: |
            ios/build/ios/*.ipa
            ios/build/*.ipa
          if-no-files-found: ignore

  release-android:
    name: Release Android to Google Play Internal Track
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'android'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: android

      - name: Grant Execute Permission
        run: |
          chmod +x android/gradlew || true
          chmod +x android/DoIt/gradlew || true
          chmod +x scripts/build-android.sh scripts/verify-mobile.sh

      - name: Configure Keystore (if provided)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/DoIt/app/release.keystore
          echo "KEYSTORE_DECODED=true" >> $GITHUB_ENV

      - name: Run Build Verification
        run: |
          ./scripts/verify-mobile.sh --android

      - name: Deploy to Google Play Internal via Fastlane
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON || secrets.SUPPLY_JSON_KEY_DATA }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SKIP_GIT_CHECK: 'true'
        run: |
          cd android
          bundle exec fastlane android beta skip_tests:${{ inputs.skip_tests || false }}

      - name: Upload Android Release AAB
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doit-android-release-aab
          path: |
            android/DoIt/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
