name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'scripts/build-android.sh'
      - 'scripts/verify-mobile.sh'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
      - 'scripts/build-android.sh'
      - 'scripts/verify-mobile.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Grant Execute Permission to Gradle Wrapper & Scripts
        run: |
          chmod +x android/gradlew || true
          chmod +x android/DoIt/gradlew || true
          chmod +x scripts/build-android.sh scripts/verify-mobile.sh

      - name: Run Build Verification Script
        run: |
          ./scripts/verify-mobile.sh --android

      - name: Run Android Unit Tests
        run: |
          cd android/DoIt
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK & Release AAB
        run: |
          cd android/DoIt
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/DoIt/app/build/reports/tests/
            android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doit-debug-apk
          path: |
            android/DoIt/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: doit-release-aab
          path: |
            android/DoIt/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
