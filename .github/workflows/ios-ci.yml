name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
      - 'scripts/build-ios.sh'
      - 'scripts/verify-mobile.sh'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-ci.yml'
      - 'scripts/build-ios.sh'
      - 'scripts/verify-mobile.sh'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test iOS App
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16+
        run: |
          echo "Selecting Xcode 16..."
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version
          swift --version

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Install xcpretty
        run: |
          gem install xcpretty --no-document || true

      - name: Run Build Verification Script
        run: |
          chmod +x scripts/build-ios.sh scripts/verify-mobile.sh
          ./scripts/build-ios.sh --test

      - name: Run iOS Unit Tests via xcodebuild / Swift
        run: |
          set -o pipefail
          mkdir -p build/reports
          if [ -f "ios/DoIt/DoIt.xcodeproj/project.pbxproj" ]; then
            echo "Running xcodebuild unit tests..."
            xcodebuild test \
              -project ios/DoIt/DoIt.xcodeproj \
              -scheme DoIt \
              -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
              -resultBundlePath build/ios-test-results.xcresult \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color --simple
          elif [ -f "ios/DoIt/Package.swift" ]; then
            echo "Running Swift Package unit tests..."
            cd ios/DoIt && swift test
          else
            echo "Testing via Fastlane..."
            cd ios && bundle exec fastlane test
          fi

      - name: Build iOS Application (Release)
        run: |
          set -o pipefail
          mkdir -p build/DerivedData
          if [ -f "ios/DoIt/DoIt.xcodeproj/project.pbxproj" ]; then
            echo "Building DoIt app..."
            xcodebuild build \
              -project ios/DoIt/DoIt.xcodeproj \
              -scheme DoIt \
              -destination 'generic/platform=iOS' \
              -derivedDataPath build/DerivedData \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty --color --simple
          elif [ -f "ios/DoIt/Package.swift" ]; then
            echo "Building Swift Package..."
            cd ios/DoIt && swift build -c release
          fi

      - name: Upload Test Results & xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/ios-test-results.xcresult
            build/reports
            ios/build/reports
          if-no-files-found: ignore
